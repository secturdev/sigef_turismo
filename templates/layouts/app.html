  <script>

    function zone(x1, z1, x2, z2, color, y = 0.02) {

    zone(59, 41, 78, 52, 0xd2a678);           // Chocolaterías Bebidas

    const wallMat = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, roughness: .9 });

      const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, t), wallMat);
      m.position.set((x1 + x2) / 2, h / 2, (z1 + z2) / 2);
      m.rotation.y = Math.atan2(-dz, dx);
      m.castShadow = true; m.receiveShadow = true; scene.add(m);
    }
    // Perímetro
    wall(2, 16, 79, 16); wall(79, 16, 79, 52); wall(79, 52, 52, 52);
    wall(52, 52, 40, 64); wall(40, 64, 28, 52); wall(28, 52, 16, 52);
    wall(16, 52, 16, 55); wall(16, 55, 2, 55); wall(2, 55, 2, 16);

    wall(59.3, 17.5, 59.3, 39.5, 2.0);                      // hall / Cavacao
    wall(59.3, 41, 59.3, 46, 2.0);                          // hall / cafetería BR
    wall(16, 46, 32, 46, 2.0); wall(48, 46, 59.3, 46, 2.0);     // borde sur del hall (deja la entrada)
    wall(15.5, 17, 15.5, 30.5, 1.2);                        // separación Salón Chocolate

    /* ============ MOBILIARIO / STANDS ============ */
    const boothCols = [0x8a6642, 0x7a5636, 0x9c7a54, 0x6f4e2e, 0x957247];
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x6b5236, roughness: .9 });
    function booth(x, z, w = 1.7, d = 1.3, h) {

      m.position.set(x, h / 2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);

    for (let z = 23.5; z <= 44; z += 2.4) booth(57.4, z, 1.1, 1.7);   // columna este
    [26, 31, 36].forEach(z => booth(17, z, 1.3, 1.7));             // columna oeste
    // Cafetería inferior derecha

    [45.5, 48.5, 51].forEach(z => booth(76.6, z, 1.3, 1.6));
    booth(63, 49.5, 1.6, 1.2); booth(71, 49.5, 1.6, 1.2);

    counter.position.set(67, 0.5, 47.5); counter.castShadow = true; scene.add(counter);

      const b = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.0, 0.45), barMat);

    const backBar = new THREE.Mesh(new THREE.BoxGeometry(6, 1.1, 0.8), boothCols ? new THREE.MeshStandardMaterial({ color: 0x8a6642 }) : null);
    backBar.position.set(8.5, 0.55, 30.4); backBar.castShadow = true; scene.add(backBar);

    /* ============ DESARROLLO COMERCIAL ============ */
    [[6, 34.5], [11, 34.5]].forEach(([x, z]) => {
      const d = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 1),

      d.position.set(x, 0.45, z); d.castShadow = true; scene.add(d);

    /* ============ CATAS (mesas y taburetes) ============ */
    const tblMat = new THREE.MeshStandardMaterial({ color: 0xefe3d3, roughness: .85 });
    const stMat = new THREE.MeshStandardMaterial({ color: 0xd8cfc4, roughness: .9 });
    [[4.5, 40.8], [9.5, 40.8], [13, 40.8], [4.5, 45.3], [9.5, 45.3], [13, 45.3], [7, 49.8], [11.5, 49.8]].forEach(([x, z]) => {
      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 0.75, 16), tblMat);
      t.position.set(x, 0.375, z); t.castShadow = true; t.receiveShadow = true; scene.add(t);
      for (let k = 0; k < 3; k++) {
        const a = k * Math.PI * 2 / 3;
        const s = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.5, 10), stMat);
        s.position.set(x + Math.cos(a) * 1.05, 0.25, z + Math.sin(a) * 1.05);
        s.castShadow = true; scene.add(s);

    /* ============ CAVACAO (árboles) ============ */
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: .9 });
    const leafA = new THREE.MeshStandardMaterial({ color: 0x4a7c3f, roughness: .9 });
    const leafB = new THREE.MeshStandardMaterial({ color: 0x5d8a4a, roughness: .9 });
    function tree(x, z, s = 1) {
      const g = new THREE.Group();
      const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.28 * s, 1.4 * s, 8), trunkMat);

      const c2 = new THREE.Mesh(new THREE.SphereGeometry(0.7 * s, 10, 8), leafB); c2.position.set(0.55 * s, 2.4 * s, 0.3 * s); c2.castShadow = true;
      const c3 = new THREE.Mesh(new THREE.SphereGeometry(0.6 * s, 10, 8), leafB); c3.position.set(-0.5 * s, 2.15 * s, -0.3 * s); c3.castShadow = true;

    /* ============ ETIQUETAS (sprites) ============ */
    function makeLabel(text, opts = {}) {
      const size = opts.size || 44, scale = opts.scale || 0.03, color = opts.color || '#3a2a1a';
      const lines = text.split('\n');
      const c = document.createElement('canvas');
      let ctx = c.getContext('2d');
      ctx.font = `bold ${size}px Arial, sans-serif`;
      let w = 0; lines.forEach(l => w = Math.max(w, ctx.measureText(l).width));
      c.width = Math.ceil(w + 48); c.height = Math.ceil(lines.length * size * 1.25 + 24);
      ctx = c.getContext('2d');
      ctx.font = `bold ${size}px Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      lines.forEach((l, i) => {
        const yy = 12 + size * 0.62 + i * size * 1.25;
        ctx.lineWidth = size * 0.16; ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.strokeText(l, c.width / 2, yy);
        ctx.fillStyle = color; ctx.fillText(l, c.width / 2, yy);
      });
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
      spr.scale.set(c.width * scale, c.height * scale, 1);
      return spr;
    }
    function addLabel(text, x, y, z, opts) { const s = makeLabel(text, opts); s.position.set(x, y, z); scene.add(s); }

    addLabel('SALÓN\nCHOCOLATE', 8.5, 2.7, 20.6, { color: '#ffffff', size: 40, scale: 0.026 });
    addLabel('DESARROLLO\nCOMERCIAL', 8.5, 2.3, 36.3, { color: '#4a3a28', size: 34, scale: 0.022 });
    addLabel('CATAS', 8.7, 2.6, 46.5, { color: '#6e2350', size: 48, scale: 0.028 });
    addLabel('CHOCOLATERÍAS Y BEBIDAS', 37, 3.0, 22.6, { color: '#3a2a1a', size: 46, scale: 0.026 });
    addLabel('CAVACAO', 68.5, 2.3, 37.8, { color: '#2f4a22', size: 46, scale: 0.028 });
    addLabel('CHOCOLATERÍAS\nBEBIDAS', 68.5, 2.5, 45.6, { color: '#4a2f18', size: 38, scale: 0.024 });
    addLabel('ENTRADA', 40, 2.2, 60.5, { color: '#3a2a1a', size: 56, scale: 0.042 });

    /* ============ PUNTOS DE INFORMACIÓN (?) ============ */
    function infoDot(x, z, y = 1.6) {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.beginPath(); ctx.arc(64, 64, 58, 0, Math.PI * 2); ctx.fillStyle = '#5b3a21'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 84px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', 64, 70);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
      spr.scale.set(1.6, 1.6, 1); spr.position.set(x, y, z); scene.add(spr);
    }
    infoDot(48.6, 45.4); infoDot(51.2, 45.4); infoDot(28.6, 50.6); infoDot(30.8, 51.6);
    infoDot(47.6, 51.2); infoDot(56, 18.5, 2.8);

    /* ============ SEÑAL DE ENTRADA (flechas) ============ */
    function arrow(x, z, rot = 0, s = 1, color = 0x8a5a3b) {
      const p = [[-0.45, 1.2], [0.45, 1.2], [0.45, -0.6], [1.2, -0.6], [0, -2], [-1.2, -0.6], [-0.45, -0.6]];
      const sh = new THREE.Shape(); sh.moveTo(p[0][0] * s, p[0][1] * s);
      for (let i = 1; i < p.length; i++) sh.lineTo(p[i][0] * s, p[i][1] * s);
      sh.closePath();
      const m = new THREE.Mesh(new THREE.ShapeGeometry(sh),
        new THREE.MeshStandardMaterial({ color, roughness: .8, side: THREE.DoubleSide }));
      m.rotation.x = -Math.PI / 2; m.rotation.z = rot;
      m.position.set(x, 0.05, z); scene.add(m);
    }
    arrow(40, 56.5, 0, 1.6); arrow(31.5, 53.5, -Math.PI / 6, 1.1); arrow(48.5, 53.5, Math.PI / 6, 1.1);

    /* ============ BUCLE ============ */
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
