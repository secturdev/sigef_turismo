<ol class="wizard-steps" aria-label="Pasos del expediente">
  <li class="wizard-step {% if step >= 1 %}is-done{% endif %} {% if step == 1 %}is-current{% endif %}">
    <span class="wizard-step__num">1</span>
    <span class="wizard-step__label">Tipo</span>
  </li>
  <li class="wizard-step {% if step >= 2 %}is-done{% endif %} {% if step == 2 %}is-current{% endif %}">
    <span class="wizard-step__num">2</span>
    <span class="wizard-step__label">Datos</span>
  </li>
  <li class="wizard-step {% if step >= 3 %}is-done{% endif %} {% if step == 3 %}is-current{% endif %}">
    <span class="wizard-step__num">3</span>
    <span class="wizard-step__label">Documentos</span>
  </li>
</ol>
