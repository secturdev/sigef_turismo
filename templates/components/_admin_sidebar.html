{% load static %}
<aside class="app-sidebar" :class="{ 'is-open': sidebarOpen }">
  <div class="app-sidebar__pattern" aria-hidden="true"
       style="--auth-pattern: url('{% static 'img/auth/patron-izquierda.png' %}')"></div>
  <div class="app-sidebar__brand">
    <a href="{% url 'autenticacion:admin_dashboard' %}" class="app-sidebar__brand-link">
      <img src="{% static 'img/brand/sigef-logo.png' %}" alt="SIGEF" class="app-sidebar__logo"
           width="220" height="64" decoding="async" />
    </a>
  </div>

  <nav class="app-sidebar__nav" aria-label="Menú de administración">
    <a href="{% url 'autenticacion:admin_dashboard' %}"
       class="app-nav-link {% if nav_active == 'admin_dashboard' %}is-active{% endif %}">
      <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75" />
      </svg>
      Inicio
    </a>
    <a href="{% url 'autenticacion:admin_users' %}"
       class="app-nav-link {% if nav_active == 'admin_users' %}is-active{% endif %}">
      <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m1.5-1.5h-3m-6-3.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM2.25 20.25a6 6 0 0 1 12 0v.75h-12v-.75Z" />
      </svg>
      Usuarios administradores
    </a>
    <a href="{% url 'autenticacion:admin_events' %}"
       class="app-nav-link {% if nav_active == 'admin_events' %}is-active{% endif %}">
      <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3.75 9.75h16.5m-15.75-4.5h15A2.25 2.25 0 0 1 21.75 7.5v11.25A2.25 2.25 0 0 1 19.5 21h-15a2.25 2.25 0 0 1-2.25-2.25V7.5A2.25 2.25 0 0 1 4.5 5.25Z" />
      </svg>
      Eventos
    </a>
  </nav>

  <div class="app-sidebar__footer">
    <p class="app-sidebar__user">{{ request.user.correo }}</p>
    <p class="app-sidebar__role">
      {% if request.user.is_superuser %}Superadministrador{% else %}Administrador{% endif %}
    </p>
    <form method="post" action="{% url 'autenticacion:admin_logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn-outline app-sidebar__logout">Cerrar sesión</button>
    </form>
  </div>
</aside>
<div class="app-sidebar-backdrop" x-show="sidebarOpen" x-cloak @click="sidebarOpen = false"></div>
