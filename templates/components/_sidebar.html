{% load static %}
<aside class="app-sidebar" :class="{ 'is-open': sidebarOpen }">
  <div class="app-sidebar__pattern" aria-hidden="true"
       style="--auth-pattern: url('{% static 'img/auth/patron-izquierda.png' %}')"></div>

  <div class="app-sidebar__brand">
    <a href="{% url 'expediente:dashboard' %}" class="app-sidebar__brand-link">
      <img src="{% static 'img/brand/sigef-logo.png' %}"
           alt="SIGEF — Sistema Integral de Gestión de Eventos y Festivales"
           class="app-sidebar__logo"
           width="220"
           height="64"
           decoding="async" />
    </a>
  </div>

  <nav class="app-sidebar__nav" aria-label="Menú principal">
    <a href="{% url 'expediente:dashboard' %}"
       class="app-nav-link {% if nav_active == 'dashboard' %}is-active{% endif %}">
      <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
      Inicio
    </a>
    <a href="{% url 'expediente:profile' %}"
       class="app-nav-link {% if nav_active == 'expediente' %}is-active{% endif %}">
      <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
      </svg>
      Mi perfil
    </a>
    <a href="{% url 'expediente:events' %}"
       class="app-nav-link {% if nav_active == 'eventos' %}is-active{% endif %}">
      <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
      </svg>
      Eventos
    </a>
  </nav>

  <div class="app-sidebar__footer">
    <p class="app-sidebar__user">{{ request.user.correo }}</p>
    <form method="post" action="{% url 'autenticacion:logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn-outline app-sidebar__logout">
        <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
        </svg>
        Cerrar sesión
      </button>
    </form>
  </div>
</aside>

<div class="app-sidebar-backdrop"
     x-show="sidebarOpen"
     x-cloak
     @click="sidebarOpen = false"></div>
